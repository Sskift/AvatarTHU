<!doctype html>
<html lang="zh-CN">
<head>
 <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light">
 <title>作业审阅 · AvatarTHU</title>
 <link rel="stylesheet" href="/workspace.css"><link rel="stylesheet" href="/desktop.css">
 <script defer src="/workspace-review.js"></script><script defer src="/workspace.js"></script><script defer src="/desktop.js"></script>
</head>
<body>
<aside class="sidebar">
 <a class="brand" href="#view=overview" title="AvatarTHU"><span class="seal" aria-hidden="true">A</span>AvatarTHU</a>
 <nav aria-label="主导航">
  <a href="#view=overview" data-nav="overview" title="作业审阅"><span aria-hidden="true">◫</span>作业审阅</a>
  <a href="#view=courses" data-nav="courses" title="我的课程"><span aria-hidden="true">▦</span>我的课程</a>
  <a href="#view=files" data-nav="files" title="课程文件"><span aria-hidden="true">▤</span>课程文件</a>
  <a href="#view=settings" data-nav="settings" title="设置与状态"><span aria-hidden="true">⚙</span>设置与状态</a>
 </nav>
 <div class="sidebar-foot"><span class="dot" id="connection-dot"></span><span id="connection">正在连接本机后台</span></div>
</aside>
<div class="shell">
 <header class="topbar">
  <div><div id="back-link" hidden></div><h1 id="title">作业审阅</h1></div>
  <div class="top-actions"><button id="scan">同步课程</button></div>
 </header>
 <div id="error" class="error" role="alert" hidden></div>
 <main id="content"><div class="empty" role="status">正在载入作业…</div></main>
</div>
<div id="toast" role="status" hidden></div>
<dialog id="preview" aria-labelledby="preview-title"><header><div><h2 id="preview-title"></h2><small id="preview-meta"></small></div><button data-close="preview" aria-label="关闭预览">×</button></header><div id="preview-body" class="preview-surface"></div><footer><button id="preview-parent" hidden>返回压缩包</button><a id="preview-download" class="button" download>下载文件</a></footer></dialog>
<dialog id="file-dialog"><form id="file-form"><h2 id="file-dialog-title"></h2><p id="file-dialog-description"></p><label id="rename-label">文件名<input id="rename-input" maxlength="120" autocomplete="off"></label><p id="file-error" class="error" hidden></p><div class="dialog-actions"><button type="button" data-close="file-dialog">取消</button><button class="primary" id="file-confirm">确认</button></div></form></dialog>
<dialog id="task-dialog" aria-labelledby="task-dialog-title"><form id="task-form"><h2 id="task-dialog-title"></h2><p id="task-dialog-description"></p><label id="ignore-reason-label">忽略原因（选填）<input id="ignore-reason" maxlength="500" autocomplete="off" placeholder="本人确认无需提交"></label><p id="task-error" class="error" role="alert" hidden></p><div class="dialog-actions"><button type="button" data-close="task-dialog">取消</button><button class="primary" id="task-confirm">确认</button></div></form></dialog>
<dialog id="mark-dialog" aria-labelledby="mark-title"><form id="mark-form">
 <h2 id="mark-title">标记两侧当前位置</h2><p id="mark-context"></p>
 <label for="mark-name">题号或名称</label><input id="mark-name" maxlength="60" required autocomplete="off" placeholder="例如：第 3 题">
 <div class="dialog-actions"><button type="button" id="remove-mark" hidden>移除此标记</button><button type="button" data-close="mark-dialog">取消</button><button type="submit" class="primary">保存位置</button></div>
</form></dialog>
<template id="task-workspace">
 <div class="desk-heading"><div id="task-meta"></div><div class="actions" id="task-links"></div></div>
 <div class="review-desk" id="review-desk">
  <div class="desk-delivery">
   <div class="desk-navigation"><div class="task-panes" role="tablist" aria-label="作业内容">
    <button role="tab" id="tab-delivery" aria-controls="pane-delivery" data-pane="delivery">对照审阅</button>
    <button role="tab" id="tab-review" aria-controls="pane-review" data-pane="review">独立复审</button>
    <button role="tab" id="tab-workflow" aria-controls="pane-workflow" data-pane="workflow">工作流</button>
   </div>
    <div class="reading-tools">
     <div class="reading-layout" role="group" aria-label="阅读布局">
      <button type="button" data-layout="both">对照</button><button type="button" data-layout="prompt">只看原题</button><button type="button" data-layout="answer">只看作答</button>
     </div>
     <button type="button" id="cite-position">引用到对话</button>
    </div>
   </div>
   <section id="pane-workflow" role="tabpanel" aria-labelledby="tab-workflow"><div id="pipeline-status"></div><ol id="activity-log" aria-label="Agent 工作记录"></ol><p id="activity-hint" class="quiet" role="status"></p></section>
   <section id="pane-delivery" role="tabpanel" aria-labelledby="tab-delivery" hidden>
    <div class="question-tools"><nav id="question-nav" aria-label="按题号对照" hidden></nav><button type="button" class="text-button" id="mark-position" hidden>标记对应位置</button></div>
    <p id="question-hint" class="quiet" role="status" hidden></p>
    <div class="reading-pair" id="reading-pair">
     <section class="reader" id="prompt-reader" aria-labelledby="prompt-heading">
      <div class="reader-heading"><h2 id="prompt-heading">老师的原题</h2><a id="prompt-download" download>下载原件</a></div>
      <div class="viewer"><div class="viewer-toolbar"><select id="prompt-choice" aria-label="选择题目或作业说明"></select></div>
       <button class="archive-back" id="prompt-back" hidden></button>
       <div class="preview-surface" id="prompt-preview" aria-label="原题预览"></div>
      </div>
     </section>
     <section class="reader" id="answer-reader" aria-labelledby="answer-heading">
      <div class="reader-heading"><h2 id="answer-heading">我的作答 <small id="answer-revision"></small></h2><a id="submission-download" download>下载本版提交文件</a></div>
      <div class="viewer"><div class="viewer-toolbar"><select id="artifact-choice" aria-label="选择作答或展示文件"></select><a id="artifact-download" download>下载所选文件</a></div>
       <button class="archive-back" id="answer-back" hidden></button>
       <div class="preview-surface" id="artifact-preview" aria-label="作答预览"></div>
      </div>
     </section>
    </div>
    <div id="delivery-notes"></div>
   </section>
   <section id="pane-review" role="tabpanel" aria-labelledby="tab-review" hidden></section>
  </div>
  <aside class="conversation" aria-labelledby="conversation-title">
   <header class="conversation-heading"><h2 id="conversation-title">与主写对话</h2><button type="button" class="text-button" id="return-reading">返回对照位置 ↑</button></header>
   <div id="conversation-log" role="log" aria-label="对话记录" aria-live="polite" aria-relevant="additions"></div>
   <form id="conversation-form">
    <div class="chat-modes" aria-label="消息用途" role="group">
     <button type="button" data-kind="ask" aria-pressed="true">问主写</button>
     <button type="button" data-kind="change" aria-pressed="false">调整产物</button>
    </div>
    <label class="sr-only" for="chat-text">给主写的消息</label>
    <textarea id="chat-text" rows="3" maxlength="12000" required></textarea>
    <details id="chat-context"><summary id="context-count">关联文件</summary><fieldset id="chat-files" aria-label="关联文件"></fieldset></details>
    <p id="chat-scope" class="quiet"></p>
    <button type="button" id="chat-rebase" hidden></button>
    <p id="chat-error" class="error" role="alert" hidden></p>
    <div class="chat-actions"><span id="chat-action-note" class="quiet"></span><button class="primary" id="chat-send" type="submit">发送</button></div>
   </form>
  </aside>
 </div>
 <div class="desk-details" id="task-secondary"></div>
</template>
<input id="upload-input" type="file" multiple hidden>
</body>
</html>
