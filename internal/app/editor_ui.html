<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>报告草稿 · AvatarTHU</title>
  <link rel="stylesheet" href="/editor.css">
  <script defer src="/desktop.js"></script>
  <script defer src="/editor.js"></script>
</head>
<body>
  <header class="topbar">
    <nav aria-label="当前位置">
      <a class="brand" id="return-task" href="/#view=overview"><span aria-hidden="true">←</span> 作业审阅</a>
      <span class="crumb-divider" aria-hidden="true">/</span><span aria-current="page">报告草稿</span>
    </nav>
    <div class="top-actions">
      <span id="save-state" role="status">载入中…</span>
      <details class="menu" id="export-menu" hidden>
        <summary>预览与导出</summary>
        <div class="menu-list">
          <button id="preview-html">预览 HTML</button>
          <button id="download-html">下载 HTML</button>
          <button id="download">下载 Markdown</button>
          <button id="download-source">下载正文与图片包</button>
        </div>
      </details>
      <button class="primary" id="submit-open" hidden>交给主写更新产物</button>
    </div>
  </header>
  <div id="error" role="alert" hidden></div>

  <main>
    <header class="document-heading">
      <div class="course" id="course"></div>
      <h1 id="task-title">正在载入报告</h1>
      <div class="metadata"><span id="edition"></span><span id="task-status"></span></div>
    </header>
    <div id="task-picker" hidden><label for="task-select">选择要编辑的作业</label><select id="task-select"></select></div>
    <section id="editor" hidden aria-label="编辑报告">
      <div class="notice" id="stale" hidden>
        <span id="stale-message"></span><button id="reload">备份草稿并载入新版</button>
      </div>
      <div id="handoff-status" class="notice" hidden role="status"></div>

      <div class="editor-layout">
        <div class="document">
          <div class="editor-toolbar">
            <div class="tabs" role="tablist" aria-label="报告视图">
              <button id="paper-tab" role="tab" aria-controls="paper" aria-selected="true" data-mode="paper">正文</button>
              <button id="markdown-tab" role="tab" aria-controls="markdown-pane" aria-selected="false" tabindex="-1" data-mode="markdown">Markdown</button>
              <button id="diff-tab" role="tab" aria-controls="diff-pane" aria-selected="false" tabindex="-1" data-mode="diff">修改对照</button>
            </div>
            <div class="paper-tools" id="paper-tools">
              <details class="menu" id="outline-menu" hidden><summary>目录</summary><nav class="menu-list" id="outline" aria-label="报告目录"></nav></details>
              <button id="multi-select" aria-pressed="false">多选</button>
            </div>
          </div>
          <div id="selection-toolbar" class="selection-toolbar" hidden>
            <span id="selection-count"></span><button id="selection-clear" hidden>清空选择</button>
            <button id="selection-discuss" hidden>写修改要求</button>
          </div>
          <article id="paper" class="paper" role="tabpanel" aria-labelledby="paper-tab"></article>
          <div id="markdown-pane" role="tabpanel" aria-labelledby="markdown-tab" hidden>
            <label class="sr-only" for="markdown">报告 Markdown</label>
            <textarea id="markdown" spellcheck="false"></textarea>
            <button id="select-source" disabled>修改选中文字</button>
          </div>
          <div id="diff-pane" class="paper" role="tabpanel" aria-labelledby="diff-tab" hidden></div>
        </div>
        <aside class="inspector" aria-label="报告修改与复审">
          <section class="review-context" id="review-context" hidden>
            <div class="section-line"><h2>独立复审</h2><span id="review-outcome"></span></div>
            <div class="micro" id="review-byline"></div>
            <p id="review-summary"></p>
            <details id="review-issues" hidden><summary id="issue-count"></summary><ol id="issues"></ol></details>
          </section>
          <section class="edit-section">
            <div class="section-line"><h2 id="selection-title">段落修改</h2><button id="clear-block" class="text-button" hidden>取消选择</button></div>
            <p class="muted" id="selection-hint">点选正文中的段落即可编辑，或请主写提出修改建议。</p>
            <div id="multi-tools" hidden><ol id="selected-blocks"></ol></div>
            <div id="block-tools" hidden><label for="block-text">段落原稿</label><textarea id="block-text" spellcheck="false" rows="5"></textarea></div>
            <div id="quote-wrap" hidden><label>选中文字</label><blockquote id="selected-quote"></blockquote></div>
            <div id="agent-tools" hidden>
              <label for="instruction">给主写的修改要求</label>
              <textarea id="instruction" placeholder="希望主写怎样改这一处？" rows="3" maxlength="12000"></textarea>
              <button class="wide accent" id="rewrite" disabled>生成修改建议</button>
            </div>
          </section>
          <section id="suggestion-section" hidden>
            <h2>主写建议</h2>
            <div id="suggestions"></div>
          </section>
        </aside>
      </div>
    </section>
  </main>
  <dialog id="submit-dialog" aria-labelledby="submit-title">
    <h2 id="submit-title">用这份草稿更新交付</h2>
    <p id="handoff-plan"></p>
    <details id="artifact-list" hidden><summary>查看关联产物</summary><ul id="related-artifacts"></ul></details>
    <label for="submit-note">给主写的补充说明 <span>选填</span></label>
    <textarea id="submit-note" rows="3" maxlength="12000" placeholder="哪些文件也需要随这份报告调整？"></textarea>
    <p class="micro">完成后可返回作业审阅，查看新版文件和复审意见。</p>
    <p id="submit-error" role="alert"></p>
    <div class="dialog-actions"><button id="submit-cancel">继续编辑</button><button class="primary" id="submit-final">开始更新</button></div>
  </dialog>
  <div id="toast" role="status" hidden></div>
</body>
</html>
