name: native checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci --prefix desktop --no-audit --no-fund
      - run: npm run assets --prefix desktop
      - run: npm test --prefix desktop
      - name: Test desktop window and navigation
        if: runner.os != 'Linux'
        run: npm run test:app --prefix desktop
      - run: go vet ./...
      - run: go test -race ./...
      - name: Build native executable
        env:
          CGO_ENABLED: '0'
        run: go build -trimpath -o build/ ./cmd/avatarthu
      - name: Clean installation without a runtime (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          export AVATARTHU_HOME="$RUNNER_TEMP/avatar-clean"
          build/avatarthu init --no-login --no-start
          "$AVATARTHU_HOME/bin/avatarthu" --version
          "$AVATARTHU_HOME/bin/avatarthu" configure --poll-interval 12h --mode codex-claude
          "$AVATARTHU_HOME/bin/avatarthu" configure --writer codex --reviewer codex
          "$AVATARTHU_HOME/bin/avatarthu" configure --reviewer claude
          test ! -d "$AVATARTHU_HOME/.venv"
      - name: Check macOS release bundle and installation
        if: runner.os == 'macOS'
        shell: bash
        run: |
          arch="$(go env GOARCH)"
          go run ./cmd/release --os darwin --arch "$arch" --out "$RUNNER_TEMP/avatar-release"
          mkdir "$RUNNER_TEMP/avatar-extract"
          tar -xzf "$RUNNER_TEMP/avatar-release/avatarthu-darwin-$arch.tar.gz" -C "$RUNNER_TEMP/avatar-extract"
          export AVATARTHU_HOME="$RUNNER_TEMP/avatar-menu-clean"
          "$RUNNER_TEMP/avatar-extract/avatarthu" init --no-login --no-start
          "$RUNNER_TEMP/avatar-extract/avatarthu" init --no-login --no-start
          codesign --verify --deep --strict "$AVATARTHU_HOME/apps/AvatarTHU.app"
          AVATARTHU_DESKTOP_BINARY="$AVATARTHU_HOME/apps/AvatarTHU.app/Contents/MacOS/AvatarTHU" npm run test:app --prefix desktop
      - name: Clean installation without a runtime (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:AVATARTHU_HOME = Join-Path $env:RUNNER_TEMP 'avatar-clean'
          & ./build/avatarthu.exe init --no-login --no-start
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:AVATARTHU_HOME/bin/avatarthu.exe" --version
          & "$env:AVATARTHU_HOME/bin/avatarthu.exe" configure --poll-interval 12h --mode codex-claude
          & "$env:AVATARTHU_HOME/bin/avatarthu.exe" configure --writer claude --reviewer claude
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:AVATARTHU_HOME/bin/avatarthu.exe" configure --reviewer codex
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Test-Path "$env:AVATARTHU_HOME/.venv") { throw 'Unexpected runtime environment' }
      - name: Check Windows desktop release and installation
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $release = Join-Path $env:RUNNER_TEMP 'avatar-desktop-release'
          $extract = Join-Path $env:RUNNER_TEMP 'avatar-desktop-extract'
          go run ./cmd/release --os windows --arch amd64 --out $release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Expand-Archive "$release/avatarthu-windows-amd64.zip" $extract
          $env:AVATARTHU_HOME = Join-Path $env:RUNNER_TEMP 'avatar-desktop-clean'
          & "$extract/avatarthu.exe" init --no-login --no-start
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:AVATARTHU_DESKTOP_BINARY = "$env:AVATARTHU_HOME/apps/AvatarTHU/AvatarTHU.exe"
          npm run test:app --prefix desktop
